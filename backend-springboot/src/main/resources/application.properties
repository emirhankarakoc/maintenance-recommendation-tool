spring.application.name=maintenance-recommendation-tool
spring.security.user.name=${SPRING_SECURITY_USER:user}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:local-dev-only}
security.jwt.secret-key=${JWT_SECRET:local-development-secret-change-me}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dealership_rec?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

cloudflare.r2.access-key=${R2_ACCESS_KEY:localdev}
cloudflare.r2.secret-key=${R2_SECRET_KEY:localdev}
cloudflare.r2.endpoint=${R2_ENDPOINT:http://localhost:9000}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:localdev}
cloudflare.r2.public-url=${R2_PUBLIC_URL:http://localhost:9000/localdev}

openai.api-key=${OPENAI_API_KEY:localdev}
